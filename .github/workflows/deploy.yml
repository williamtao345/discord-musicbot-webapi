name: Deploy to VM

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Get deployment path from service
        id: get_path
        run: |
          DEPLOY_PATH=$(systemctl show musicbot.service -p WorkingDirectory --value)
          echo "deploy_path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          echo "Deployment path: $DEPLOY_PATH"

      - name: Pull latest code
        run: |
          cd ${{ steps.get_path.outputs.deploy_path }}
          git fetch origin
          git reset --hard origin/master

      - name: Install dependencies
        run: |
          cd ${{ steps.get_path.outputs.deploy_path }}
          if [ -f requirements.txt ]; then
            VENV_ACTIVATE="$(dirname ${{ steps.get_path.outputs.deploy_path }})/bin/activate"
            if [ -f "$VENV_ACTIVATE" ]; then
              source "$VENV_ACTIVATE"
              pip install -r requirements.txt
            else
              echo "Warning: Virtual environment not found at $VENV_ACTIVATE"
            fi
          fi

      - name: Restart musicbot service
        run: sudo systemctl restart musicbot.service

      - name: Check service status
        run: sudo systemctl status musicbot.service --no-pager
